name: Phase 1 Foundation Verification

on:
  push:
    branches:
      - phase-1-foundation-hardening
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-1-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests-and-debug-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" "platform-tools" "platforms;android-36" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Verify online unit tests and debug APK compilation
        shell: bash
        run: ./gradlew --no-daemon --stacktrace testOnlineDebugUnitTest assembleOnlineDebug

      - name: Verify offline unit tests and debug APK compilation
        shell: bash
        run: ./gradlew --no-daemon --stacktrace testOfflineDebugUnitTest assembleOfflineDebug
